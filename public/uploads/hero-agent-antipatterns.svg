<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An AI agent emitting a code diff into a human review checkpoint">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#08080c"/>
    </linearGradient>
    <linearGradient id="wire" x1="300" y1="300" x2="900" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff2e88"/>
      <stop offset="1" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- grid backdrop -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200"/>
    <path d="M100 0V600M300 0V600M500 0V600M700 0V600M900 0V600M1100 0V600"/>
  </g>

  <!-- agent node (left) -->
  <g filter="url(#glow)">
    <rect x="96" y="238" width="124" height="124" rx="6" fill="#12121c" stroke="#ff2e88" stroke-width="2"/>
  </g>
  <text x="158" y="292" font-family="JetBrains Mono, monospace" font-size="20" fill="#ff2e88" text-anchor="middle">agent</text>
  <g stroke="#ff2e88" stroke-width="2" stroke-linecap="round">
    <path d="M126 322h64M126 336h44"/>
  </g>

  <!-- wire agent -> review -->
  <path d="M220 300 C 280 300, 300 300, 340 300" stroke="url(#wire)" stroke-width="3" fill="none"/>
  <circle cx="340" cy="300" r="5" fill="#00f0ff"/>

  <!-- diff / review window (center) -->
  <g>
    <rect x="352" y="150" width="500" height="300" rx="8" fill="#12121c" stroke="#262636" stroke-width="1.5"/>
    <rect x="352" y="150" width="500" height="40" rx="8" fill="#191926"/>
    <circle cx="376" cy="170" r="5" fill="#ff3b5c"/>
    <circle cx="396" cy="170" r="5" fill="#ffd02e"/>
    <circle cx="416" cy="170" r="5" fill="#2effa5"/>
    <text x="602" y="175" font-family="JetBrains Mono, monospace" font-size="14" fill="#9a9ab0" text-anchor="middle">review.diff</text>

    <!-- diff lines -->
    <g font-family="JetBrains Mono, monospace" font-size="15">
      <rect x="352" y="212" width="500" height="24" fill="#ff3b5c" fill-opacity="0.10"/>
      <text x="376" y="229" fill="#ff3b5c">- apply(diff)  // never read</text>
      <rect x="352" y="248" width="500" height="24" fill="#2effa5" fill-opacity="0.10"/>
      <text x="376" y="265" fill="#2effa5">+ read(diff)</text>
      <rect x="352" y="284" width="500" height="24" fill="#2effa5" fill-opacity="0.10"/>
      <text x="376" y="301" fill="#2effa5">+ test(behaviour)</text>
      <text x="376" y="337" fill="#9a9ab0">  ship()</text>
      <text x="376" y="373" fill="#5a5a70">  // you own the judgment</text>
    </g>
  </g>

  <!-- wire review -> human -->
  <path d="M852 300 C 900 300, 920 300, 980 300" stroke="url(#wire)" stroke-width="3" fill="none"/>
  <circle cx="852" cy="300" r="5" fill="#ff2e88"/>

  <!-- human checkpoint (right) -->
  <g filter="url(#glow)">
    <rect x="980" y="238" width="124" height="124" rx="6" fill="#12121c" stroke="#00f0ff" stroke-width="2"/>
  </g>
  <text x="1042" y="286" font-family="JetBrains Mono, monospace" font-size="18" fill="#00f0ff" text-anchor="middle">human</text>
  <path d="M1016 316 l18 18 l36 -38" stroke="#00f0ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- title strip -->
  <text x="96" y="512" font-family="JetBrains Mono, monospace" font-size="26" fill="#e8e8f0">The Antipatterns of Coding With an AI Agent</text>
  <text x="96" y="544" font-family="JetBrains Mono, monospace" font-size="16" fill="#00f0ff">// the agent owns the loop — you own everything without one</text>
</svg>
